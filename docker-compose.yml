# Local / single-host deployment
#   cp .env.example .env   (edit)
#   docker compose up -d --build
#   docker compose run --rm migrate
# The worker starts one SinoBee container per user through the host docker socket.
# Build the SinoBee image first:  git clone https://github.com/CAFECA-IO/SinoBee && docker build -t sinobee:latest SinoBee
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: sinobee
      POSTGRES_PASSWORD: sinobee
      POSTGRES_DB: sinobee
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sinobee"]
      interval: 5s
      retries: 10

  migrate:
    build: { context: ., target: worker }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://sinobee:sinobee@db:5432/sinobee
    command: sh -c "npx prisma migrate deploy && npx tsx prisma/seed.ts"
    depends_on: { db: { condition: service_healthy } }
    profiles: ["tools"]

  web:
    build: { context: ., target: web }
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://sinobee:sinobee@db:5432/sinobee
      STORAGE_LOCAL_DIR: /data/storage
    ports: ["3000:3000"]
    volumes: [storage:/data/storage]
    depends_on: { db: { condition: service_healthy } }

  worker:
    build: { context: ., target: worker }
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://sinobee:sinobee@db:5432/sinobee
      STORAGE_LOCAL_DIR: /data/storage
    volumes:
      - storage:/data/storage
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on: { db: { condition: service_healthy } }

volumes:
  pgdata:
  storage:
